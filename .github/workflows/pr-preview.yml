name: PR Preview Build

# Builds the site for every pull request so you can verify the change
# before merging. Uploads the built `dist/` folder as a downloadable
# artifact and comments the link on the PR.
#
# Note: GitHub Pages only hosts one deploy target at a time, so this does
# NOT publish a live preview URL. For that, connect the repo to Vercel or
# Netlify (both configs already exist in the repo).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ensure source entry (index.html points to /src/main.tsx)
        run: cp index.dev.html index.html

      - run: npm run build

      - name: Upload built site as artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-preview
          path: dist
          retention-days: 14

      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### 📦 PR preview build ready',
              '',
              `Built commit: \`${context.sha.substring(0,7)}\``,
              '',
              `**[Download the built site](${runUrl})** → open the run, scroll to *Artifacts*, download \`pr-${context.issue.number}-preview.zip\`, unzip, and open \`index.html\` in your browser.`,
              '',
              '_For live preview URLs on every PR, connect the repo to Vercel or Netlify — the configs already exist in this repo._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('PR preview build ready'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
